<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Not found · WashWise</title>
    <!-- Served only for missing /assets/* files (netlify.toml); app pages always get index.html.
         Colors are the --ww-ink / --ww-bg tokens (light and dark), inline because no app CSS loads here. -->
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #ffffff;
        color: #1f335c;
        text-align: center;
        padding: 0 26px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0e1729;
          color: #e6ecf5;
        }
      }
      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Not found</h1>
      <p>This file isn't part of the current WashWise. <a href="/">Open WashWise</a></p>
    </main>
  </body>
